<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pax — Tela Mobile (DePIN)</title>

    <!-- Tailwind CDN (protótipo) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              pax: {
                bg: "#070712",
                panel: "#0B0B1C",
                stroke: "rgba(255,255,255,0.08)",
                neon: "#A7FFEA",
                neon2: "#7C3AED",
                warn: "#FF4D7D",
              },
            },
          },
        },
      };
    </script>
    <style>
      /* Pequenos ajustes “cyberpunk” sem depender de plugins */
      .pax-grid {
        background-image:
          radial-gradient(1200px 700px at 20% -20%, rgba(124, 58, 237, 0.22), transparent 55%),
          radial-gradient(900px 600px at 100% 0%, rgba(167, 255, 234, 0.16), transparent 60%),
          radial-gradient(700px 500px at 35% 110%, rgba(255, 77, 125, 0.12), transparent 55%),
          linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: auto, auto, auto, 28px 28px, 28px 28px;
        background-position: center, center, center, center, center;
      }

      @keyframes paxPulse {
        0%, 100% { transform: scale(1); opacity: 0.55; }
        50% { transform: scale(1.25); opacity: 1; }
      }
      .pax-pulse {
        animation: paxPulse 1.35s ease-in-out infinite;
      }
    </style>
  </head>
  <body class="min-h-dvh bg-pax-bg text-white pax-grid">
    <div id="root"></div>

    <!-- React 18 UMD (protótipo sem build) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script>
      const { useMemo, useState, useEffect, useCallback } = React;

      function cx() {
        return Array.from(arguments).filter(Boolean).join(" ");
      }

      function PillButton(props) {
        const { active, tone, children, onClick, disabled } = props;
        const toneMap = {
          base: "border-pax-stroke bg-white/0 hover:bg-white/5",
          neon: "border-pax-neon/30 hover:bg-pax-neon/10",
          warn: "border-pax-warn/30 hover:bg-pax-warn/10",
        };
        return React.createElement(
          "button",
          {
            type: "button",
            disabled,
            onClick,
            className: cx(
              "w-full select-none rounded-xl border px-3 py-2 text-sm transition",
              "disabled:opacity-50 disabled:cursor-not-allowed",
              toneMap[tone || "base"],
              active && "bg-white/8 border-white/20"
            ),
          },
          children
        );
      }

      function ToggleChip(props) {
        const { active, children, onClick } = props;
        return React.createElement(
          "button",
          {
            type: "button",
            onClick,
            className: cx(
              "inline-flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs tracking-wide transition",
              "border-pax-stroke bg-white/0 hover:bg-white/5",
              active && "border-pax-neon/35 bg-pax-neon/10"
            ),
          },
          children
        );
      }

      function SectionTitle(props) {
        return React.createElement(
          "div",
          { className: "mb-2 flex items-end justify-between gap-3" },
          React.createElement(
            "h2",
            { className: "text-sm font-semibold tracking-wide text-white/90" },
            props.children
          ),
          props.trailing
        );
      }

      function StepIndicator(props) {
        const steps = [
          { id: "home", label: "Detectar" },
          { id: "trip", label: "Viagem" },
          { id: "evaluate", label: "Avaliar" },
        ];
        const currentIdx = steps.findIndex((s) => s.id === props.screen);
        return React.createElement(
          "div",
          { className: "mb-4 flex items-center gap-1" },
          steps.map((step, idx) =>
            React.createElement(
              "div",
              { key: step.id, className: "flex flex-1 items-center gap-1" },
              React.createElement(
                "div",
                {
                  className: cx(
                    "flex h-7 flex-1 items-center justify-center rounded-lg border text-[10px] font-semibold tracking-wide transition",
                    idx <= currentIdx
                      ? "border-pax-neon/30 bg-pax-neon/10 text-pax-neon"
                      : "border-pax-stroke bg-white/0 text-white/40"
                  ),
                },
                step.label
              ),
              idx < steps.length - 1 &&
                React.createElement("div", {
                  className: cx(
                    "h-px w-2 shrink-0",
                    idx < currentIdx ? "bg-pax-neon/40" : "bg-white/10"
                  ),
                })
            )
          )
        );
      }

      function PaxApp() {
        const lines = useMemo(
          () => ["Interbairros IV", "Campo Comprido / Capão Raso", "Fazendinha", "Interbairros V", "Cabral / Portão"],
          []
        );

        const occupancyOptions = useMemo(
          () => [
            { id: "vazio", label: "Vazio", hint: "Assentos livres" },
            { id: "baixo", label: "Baixa", hint: "Pouca gente" },
            { id: "medio", label: "Média", hint: "Fluxo normal" },
            { id: "cheio", label: "Cheio", hint: "Apertado" },
            { id: "lotado", label: "Lotado", hint: "No limite" },
          ],
          []
        );

        const positiveOptions = useMemo(
          () => [
            { id: "ar", label: "Ar condicionado" },
            { id: "motorista", label: "Motorista prudente" },
            { id: "rapida", label: "Viagem rápida" },
            { id: "limpo", label: "Limpo" },
          ],
          []
        );

        const problemOptions = useMemo(
          () => [
            { id: "superlotado", label: "Superlotado" },
            { id: "atraso", label: "Atrasou muito" },
            { id: "limpeza_ruim", label: "Limpeza ruim" },
            { id: "direcao", label: "Direção brusca" },
          ],
          []
        );

        const [screen, setScreen] = useState("home");
        const [detectedLine, setDetectedLine] = useState("Interbairros IV");
        const [tripLine, setTripLine] = useState("");
        const [quickFilterOpen, setQuickFilterOpen] = useState(false);
        const [occupancy, setOccupancy] = useState("");
        const [occupancyReported, setOccupancyReported] = useState(false);

        const [backIsFull, setBackIsFull] = useState("");
        const [standing, setStanding] = useState("");

        const [positives, setPositives] = useState([]);
        const [problems, setProblems] = useState([]);

        const [toast, setToast] = useState("");
        const [balance, setBalance] = useState(12.5);
        const [gpsMoving, setGpsMoving] = useState(false);

        const isLotado = occupancy === "lotado";
        const canSubmitOccupancy = useMemo(() => {
          if (!occupancy) return false;
          if (!isLotado) return true;
          return Boolean(backIsFull) && Boolean(standing);
        }, [occupancy, isLotado, backIsFull, standing]);

        const canSubmitEvaluation = positives.length > 0 || problems.length > 0;

        const showToast = useCallback((msg, duration) => {
          setToast(msg);
          window.clearTimeout(window.__paxToastTimer);
          window.__paxToastTimer = window.setTimeout(() => setToast(""), duration || 2800);
        }, []);

        function simulateGpsDetect() {
          const next = lines[Math.floor(Math.random() * lines.length)];
          setDetectedLine(next);
          showToast("GPS atualizou a linha detectada.");
        }

        function onPickOccupancy(id) {
          setOccupancy(id);
          setOccupancyReported(false);
          if (id !== "lotado") {
            setBackIsFull("");
            setStanding("");
          }
        }

        function resetOccupancyForm() {
          setOccupancy("");
          setBackIsFull("");
          setStanding("");
          setOccupancyReported(false);
        }

        function resetEvaluationForm() {
          setPositives([]);
          setProblems([]);
        }

        function startTrip() {
          setTripLine(detectedLine);
          setScreen("trip");
          setGpsMoving(true);
          resetOccupancyForm();
          showToast("Viagem iniciada em " + detectedLine + ".");
        }

        function endTrip(source) {
          setGpsMoving(false);
          setScreen("evaluate");
          resetEvaluationForm();
          if (source === "gps") {
            showToast("GPS detectou parada — hora de avaliar a viagem.");
          } else {
            showToast("Viagem finalizada — conte como foi.");
          }
        }

        function onSubmitOccupancy() {
          if (!canSubmitOccupancy) return;
          setOccupancyReported(true);
          setBalance((prev) => prev + 0.25);
          showToast("Lotação enviada! +0.25 tokens PAX.", 3200);
        }

        function toggleTag(list, setList, id) {
          setList((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
        }

        function onSubmitEvaluation() {
          if (!canSubmitEvaluation) return;
          setBalance((prev) => prev + 0.5);
          showToast("Avaliação enviada! +0.50 tokens PAX.", 3200);
          setScreen("home");
          setTripLine("");
          resetOccupancyForm();
          resetEvaluationForm();
        }

        useEffect(function () {
          if (screen !== "trip" || !gpsMoving) return;
          var timer = window.setTimeout(function () {
            if (Math.random() > 0.55) {
              setGpsMoving(false);
              endTrip("gps");
            }
          }, 18000);
          return function () {
            window.clearTimeout(timer);
          };
        }, [screen, gpsMoving, tripLine]);

        function renderHeader() {
          return React.createElement(
            "header",
            { className: "mb-4 flex items-center justify-between gap-4" },
            React.createElement(
              "div",
              { className: "flex items-center gap-3" },
              React.createElement(
                "div",
                { className: "relative grid h-11 w-11 place-items-center rounded-2xl border border-pax-stroke bg-pax-panel" },
                React.createElement("div", {
                  className: "absolute inset-0 rounded-2xl ring-1 ring-inset ring-pax-neon/15",
                }),
                React.createElement(
                  "span",
                  { className: "text-base font-semibold tracking-widest text-pax-neon" },
                  "P"
                )
              ),
              React.createElement(
                "div",
                null,
                React.createElement("div", { className: "text-lg font-semibold tracking-wide" }, "Pax"),
                React.createElement(
                  "div",
                  { className: "text-xs text-white/60" },
                  screen === "home"
                    ? "DePIN · Detectar e iniciar viagem"
                    : screen === "trip"
                      ? "DePIN · Viagem em andamento"
                      : "DePIN · Avaliar experiência"
                )
              )
            ),
            screen === "home" &&
              React.createElement(
                "button",
                {
                  type: "button",
                  onClick: simulateGpsDetect,
                  className:
                    "rounded-xl border border-pax-neon/25 bg-pax-neon/10 px-3 py-2 text-xs font-semibold tracking-wide text-pax-neon hover:bg-pax-neon/15 transition",
                },
                "Simular GPS"
              ),
            screen === "trip" &&
              React.createElement(
                "button",
                {
                  type: "button",
                  onClick: function () {
                    setGpsMoving(false);
                    endTrip("gps");
                  },
                  className:
                    "rounded-xl border border-pax-neon2/30 bg-pax-neon2/10 px-3 py-2 text-xs font-semibold tracking-wide text-pax-neon hover:bg-pax-neon2/15 transition",
                },
                "Simular parada"
              )
          );
        }

        function renderWallet() {
          return React.createElement(
            "div",
            { className: "mb-4 rounded-2xl border border-pax-stroke bg-pax-panel/90 p-4" },
            React.createElement(
              "div",
              { className: "flex items-center justify-between gap-3" },
              React.createElement(
                "div",
                null,
                React.createElement("div", { className: "text-xs text-white/60" }, "Carteira"),
                React.createElement(
                  "div",
                  { className: "mt-1 text-sm font-semibold tracking-wide text-white/90" },
                  "Saldo PAX"
                )
              ),
              React.createElement(
                "div",
                { className: "text-right" },
                React.createElement(
                  "div",
                  { className: "text-2xl font-semibold tracking-wide text-pax-neon" },
                  balance.toFixed(2)
                ),
                React.createElement("div", { className: "text-xs text-white/55" }, "tokens")
              )
            )
          );
        }

        function renderGpsPanel(mode) {
          var line = mode === "trip" ? tripLine : detectedLine;
          var label = mode === "trip" ? "Ônibus em viagem (GPS)" : "Detecção rápida (GPS)";
          return React.createElement(
            "div",
            { className: "mb-4 rounded-2xl border border-pax-stroke bg-pax-panel/90 p-4" },
            React.createElement(
              "div",
              { className: "flex items-start justify-between gap-3" },
              React.createElement(
                "div",
                null,
                React.createElement("div", { className: "text-xs text-white/60" }, label),
                React.createElement(
                  "div",
                  { className: "mt-1 flex items-center gap-2" },
                  React.createElement("span", {
                    className: cx(
                      "inline-block h-2 w-2 rounded-full pax-pulse",
                      mode === "trip" && gpsMoving ? "bg-pax-neon" : "bg-pax-neon2"
                    ),
                    "aria-hidden": true,
                  }),
                  React.createElement(
                    "div",
                    { className: "text-base font-semibold tracking-wide" },
                    line
                  )
                ),
                mode === "trip" &&
                  React.createElement(
                    "div",
                    { className: "mt-2 text-xs text-white/55" },
                    gpsMoving
                      ? "Rastreando movimento — parada detectada automaticamente."
                      : "Parada detectada pelo GPS."
                  )
              ),
              mode === "home" &&
                React.createElement(
                  "button",
                  {
                    type: "button",
                    onClick: function () {
                      setQuickFilterOpen(function (v) {
                        return !v;
                      });
                    },
                    className:
                      "rounded-xl border border-pax-stroke bg-white/0 px-3 py-2 text-xs text-white/80 hover:bg-white/5 transition",
                  },
                  quickFilterOpen ? "Fechar filtro" : "Filtro rápido"
                )
            ),
            mode === "home" &&
              quickFilterOpen &&
              React.createElement(
                "div",
                { className: "mt-4" },
                React.createElement(
                  "div",
                  { className: "mb-2 text-xs text-white/60" },
                  "Selecione uma linha detectada"
                ),
                React.createElement(
                  "div",
                  { className: "flex flex-wrap gap-2" },
                  lines.map(function (name) {
                    return React.createElement(
                      ToggleChip,
                      {
                        key: name,
                        active: detectedLine === name,
                        onClick: function () {
                          setDetectedLine(name);
                        },
                      },
                      React.createElement("span", {
                        className: cx(
                          "h-1.5 w-1.5 rounded-full",
                          detectedLine === name ? "bg-pax-neon" : "bg-white/30"
                        ),
                      }),
                      name
                    );
                  })
                )
              )
          );
        }

        function renderOccupancySection() {
          return React.createElement(
            "div",
            { className: "rounded-2xl border border-pax-stroke bg-pax-panel/90 p-4" },
            React.createElement(
              SectionTitle,
              {
                trailing: occupancyReported
                  ? React.createElement(
                      "span",
                      { className: "text-[10px] font-semibold tracking-wide text-pax-neon" },
                      "Enviado ✓"
                    )
                  : null,
              },
              "Como está a lotação agora?"
            ),
            React.createElement(
              "div",
              { className: "grid grid-cols-2 gap-3" },
              occupancyOptions.map(function (opt) {
                return React.createElement(
                  PillButton,
                  {
                    key: opt.id,
                    active: occupancy === opt.id,
                    tone: opt.id === "lotado" ? "warn" : opt.id === "cheio" ? "neon" : "base",
                    onClick: function () {
                      onPickOccupancy(opt.id);
                    },
                  },
                  React.createElement(
                    "div",
                    { className: "flex items-center justify-between gap-3" },
                    React.createElement(
                      "div",
                      null,
                      React.createElement("div", { className: "font-semibold tracking-wide" }, opt.label),
                      React.createElement("div", { className: "text-xs text-white/55" }, opt.hint)
                    ),
                    React.createElement("div", {
                      className: cx(
                        "h-2.5 w-2.5 rounded-full",
                        occupancy === opt.id
                          ? opt.id === "lotado"
                            ? "bg-pax-warn"
                            : "bg-pax-neon"
                          : "bg-white/20"
                      ),
                      "aria-hidden": true,
                    })
                  )
                );
              })
            ),
            isLotado &&
              React.createElement(
                "div",
                { className: "mt-4 rounded-2xl border border-pax-warn/25 bg-pax-warn/5 p-4" },
                React.createElement(
                  "div",
                  { className: "mb-3 text-xs font-semibold tracking-wide text-pax-warn" },
                  "Detalhes (quando Lotado)"
                ),
                React.createElement(
                  "div",
                  { className: "mb-4" },
                  React.createElement(
                    "div",
                    { className: "mb-2 text-sm font-semibold text-white/90" },
                    "O fundo do ônibus está cheio?"
                  ),
                  React.createElement(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    ["Sim", "Não"].map(function (label) {
                      return React.createElement(
                        PillButton,
                        {
                          key: label,
                          active: backIsFull === label,
                          tone: "warn",
                          onClick: function () {
                            setBackIsFull(label);
                            setOccupancyReported(false);
                          },
                        },
                        label
                      );
                    })
                  )
                ),
                React.createElement(
                  "div",
                  null,
                  React.createElement(
                    "div",
                    { className: "mb-2 text-sm font-semibold text-white/90" },
                    "Quantidade de pessoas de pé"
                  ),
                  React.createElement(
                    "div",
                    { className: "grid grid-cols-2 gap-3" },
                    ["+5", "+10", "+20", "Impossível contar"].map(function (label) {
                      return React.createElement(
                        PillButton,
                        {
                          key: label,
                          active: standing === label,
                          tone: "warn",
                          onClick: function () {
                            setStanding(label);
                            setOccupancyReported(false);
                          },
                        },
                        label
                      );
                    })
                  )
                )
              )
          );
        }

        function renderHomeScreen() {
          return React.createElement(
            React.Fragment,
            null,
            renderGpsPanel("home"),
            React.createElement(
              "button",
              {
                type: "button",
                onClick: startTrip,
                className: cx(
                  "w-full rounded-2xl border px-4 py-4 text-sm font-semibold tracking-wide transition",
                  "border-pax-neon/30 bg-pax-neon/15 text-pax-neon hover:bg-pax-neon/20"
                ),
              },
              React.createElement(
                "div",
                { className: "flex items-center justify-between gap-3" },
                React.createElement(
                  "div",
                  null,
                  React.createElement("div", null, "Iniciar viagem"),
                  React.createElement(
                    "div",
                    { className: "text-xs text-white/60 font-normal" },
                    "Embarcar no ônibus detectado"
                  )
                ),
                React.createElement(
                  "div",
                  { className: "rounded-xl border border-pax-neon/25 bg-black/20 px-3 py-2 text-xs text-white/70" },
                  detectedLine.split(" ")[0]
                )
              )
            ),
            React.createElement(
              "div",
              { className: "mt-3 text-center text-xs text-white/55" },
              "O GPS identifica o ônibus próximo. Toque para começar a registrar a viagem."
            )
          );
        }

        function renderTripScreen() {
          return React.createElement(
            React.Fragment,
            null,
            renderGpsPanel("trip"),
            renderOccupancySection(),
            React.createElement(
              "div",
              { className: "mt-4 space-y-3" },
              React.createElement(
                "button",
                {
                  type: "button",
                  onClick: onSubmitOccupancy,
                  disabled: !canSubmitOccupancy,
                  className: cx(
                    "w-full rounded-2xl border px-4 py-4 text-sm font-semibold tracking-wide transition",
                    "border-pax-neon/30 bg-pax-neon/15 text-pax-neon hover:bg-pax-neon/20",
                    "disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:bg-pax-neon/15"
                  ),
                },
                React.createElement(
                  "div",
                  { className: "flex items-center justify-between gap-3" },
                  React.createElement(
                    "div",
                    null,
                    React.createElement("div", null, "Reportar lotação"),
                    React.createElement(
                      "div",
                      { className: "text-xs text-white/60 font-normal" },
                      "Ajude outros passageiros em tempo real"
                    )
                  ),
                  React.createElement(
                    "div",
                    { className: "rounded-xl border border-pax-neon/25 bg-black/20 px-3 py-2 text-xs" },
                    React.createElement("span", { className: "text-white/70" }, "+"),
                    React.createElement("span", { className: "ml-1 text-pax-neon font-semibold" }, "0.25"),
                    React.createElement("span", { className: "ml-1 text-white/70" }, "PAX")
                  )
                )
              ),
              React.createElement(
                "button",
                {
                  type: "button",
                  onClick: function () {
                    endTrip("manual");
                  },
                  className: cx(
                    "w-full rounded-2xl border px-4 py-4 text-sm font-semibold tracking-wide transition",
                    "border-pax-warn/30 bg-pax-warn/10 text-pax-warn hover:bg-pax-warn/15"
                  ),
                },
                React.createElement(
                  "div",
                  { className: "flex items-center justify-between gap-3" },
                  React.createElement(
                    "div",
                    null,
                    React.createElement("div", null, "Finalizar viagem"),
                    React.createElement(
                      "div",
                      { className: "text-xs text-white/60 font-normal" },
                      "Desembarquei — avaliar experiência"
                    )
                  ),
                  React.createElement(
                    "div",
                    { className: "rounded-xl border border-pax-warn/25 bg-black/20 px-3 py-2 text-xs text-white/70" },
                    "Descer"
                  )
                )
              ),
              React.createElement(
                "div",
                { className: "text-center text-xs text-white/55" },
                "A viagem encerra ao detectar parada (GPS) ou ao tocar em Finalizar."
              )
            )
          );
        }

        function renderEvaluationScreen() {
          return React.createElement(
            React.Fragment,
            null,
            React.createElement(
              "div",
              { className: "mb-4 rounded-2xl border border-pax-stroke bg-pax-panel/90 p-4" },
              React.createElement("div", { className: "text-xs text-white/60" }, "Viagem concluída"),
              React.createElement(
                "div",
                { className: "mt-1 text-base font-semibold tracking-wide" },
                tripLine
              ),
              React.createElement(
                "div",
                { className: "mt-2 text-xs text-white/55" },
                "Conte o que foi bom e o que pode melhorar."
              )
            ),
            React.createElement(
              "div",
              { className: "mb-4 rounded-2xl border border-pax-stroke bg-pax-panel/90 p-4" },
              React.createElement(SectionTitle, null, "Pontos positivos"),
              React.createElement(
                "div",
                { className: "flex flex-wrap gap-2" },
                positiveOptions.map(function (opt) {
                  var active = positives.includes(opt.id);
                  return React.createElement(
                    ToggleChip,
                    {
